services:
  - type: web
    name: radar-rotas-whatsapp
    env: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: radar-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: WA_AUTH_DIR
        value: /opt/render/project/src/data/auth_info_baileys
