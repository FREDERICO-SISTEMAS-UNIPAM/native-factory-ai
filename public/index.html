<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Radar de Rotas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Radar de Rotas</h1>
      <p id="status">Carregando…</p>
    </header>
    <nav>
      <button data-tab="connect" class="active">WhatsApp</button>
      <button data-tab="radar">Radar</button>
      <button data-tab="companies">Empresas</button>
    </nav>
    <section id="connect" class="tab active">
      <h2>Conexão WhatsApp</h2>
      <p>Conecte uma conta autorizada.</p>
      <button id="connectButton">Conectar WhatsApp</button>
      <img id="qr" hidden alt="QR Code WhatsApp">
      <p id="connectMessage"></p>
      <button id="logoutButton" class="secondary">Encerrar sessão</button>
    </section>
    <section id="radar" class="tab">
      <h2>Radar e alertas</h2>
      <button id="radarButton">Ativar radar e áudio</button>
      <p id="gps">GPS ainda não ativado.</p>
      <article id="alert" hidden>
        <h2>🎯 ROTA PEGA</h2>
        <p id="alertText"></p>
        <button id="silence">Silenciar</button>
      </article>
      <p id="typing"></p>
    </section>
    <section id="companies" class="tab">
      <h2>Empresas monitoradas</h2>
      <form id="companyForm">
        <input name="nome" placeholder="Nome da empresa" required>
        <input name="telefone" inputmode="numeric" placeholder="WhatsApp: 55 DDD número" required>
        <div class="grid">
          <input name="lat" type="number" step="any" placeholder="Latitude" required>
          <input name="lng" type="number" step="any" placeholder="Longitude" required>
        </div>
        <button type="button" id="useLocation" class="secondary">Usar minha localização</button>
        <input name="raioMaxKm" type="number" step="0.1" min="0.1" placeholder="Raio máximo (km)" required>
        <input name="palavrasChave" placeholder="Palavras-chave (opcional, separadas por vírgula)">
        <button type="submit">Salvar empresa</button>
      </form>
      <div id="companyList"></div>
    </section>
  </main>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
